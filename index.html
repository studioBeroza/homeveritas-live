<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Homeveritas Live-Messung</title>
<style>
:root{--bg:#0b0b12;--card:#15151f;--line:#2a2a38;--ink:#f2f0ea;--ink2:#a9a69c;--g:#39ff88;--o:#f26a1b;--p:#ff3df0;--bad:#ff5a4d;--warn:#ffd23d}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Georgian",sans-serif;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.wm{font:800 1.15rem/1 system-ui;letter-spacing:.03em}.wm b:first-child{color:var(--g)}.wm b:last-child{color:var(--p)}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
h1{font-size:1.5rem;margin:10px 0 4px}p{margin:6px 0}.muted{color:var(--ink2);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:700 1rem system-ui;min-height:46px;cursor:pointer;background:var(--g);color:#0b0b12}
.btn.o{background:var(--o)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.acc{display:flex;align-items:center;gap:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ink2);flex:none}
.big{font:800 2rem/1 system-ui}
.coord{font:600 .95rem ui-monospace,Menlo,monospace;color:var(--ink2);overflow-wrap:anywhere}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.f{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.f span{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}.f b{font-size:1.25rem}
canvas{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:block;margin:10px 0}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;border:1px solid var(--line)}.msg.err{border-color:var(--bad);color:#ffb4ad}.msg.ok{border-color:var(--g)}.msg.warn{border-color:var(--warn)}
ol{padding-left:22px;margin:8px 0}li{margin:4px 0;font:.9rem ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
label.in{display:block;margin:10px 0 0;font-size:.9rem;color:var(--ink2)}input[type=number]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><div class="wm"><b>HOME</b> <b>VERITAS</b></div><select id="lang" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="ka">ქართული</option></select></header>
<h1 id="t-title"></h1><p class="muted" id="t-sub"></p>

<section class="card">
  <div class="acc"><span class="dot" id="dot"></span><div><div class="big" id="acc">–</div><div class="muted" id="accn"></div></div></div>
  <p class="coord" id="pos"></p>
  <div class="row"><button class="btn" id="start"></button><button class="btn ghost" id="stop" hidden></button></div>
  <div class="msg err" id="err" hidden></div>
</section>

<section class="card">
  <h2 id="t-pts" style="margin:0 0 6px;font-size:1.1rem"></h2>
  <p class="muted" id="t-how"></p>
  <label class="in"><span id="t-avg"></span><input id="avg" type="number" min="3" max="60" step="1" value="10"></label>
  <div class="row" style="margin-top:12px"><button class="btn o" id="add" disabled></button><button class="btn ghost" id="undo"></button><button class="btn ghost" id="clear"></button></div>
  <div class="bar" id="barw" hidden><i id="bar"></i></div>
  <label class="in"><input type="checkbox" id="auto"> <span id="t-auto"></span></label>
  <label class="in" id="stepw" hidden><span id="t-step"></span><input id="step" type="number" min="1" max="50" step="1" value="5"></label>
  <ol id="list"></ol>
</section>

<section class="card" id="res" hidden>
  <h2 id="t-res" style="margin:0 0 6px;font-size:1.1rem"></h2>
  <div class="grid" id="facts"></div>
  <div class="msg" id="warn" hidden></div>
  <canvas id="cv" width="640" height="460"></canvas>
  <div class="row"><button class="btn" id="copy"></button><button class="btn ghost" id="gpx">GPX</button><button class="btn ghost" id="gj">GeoJSON</button><button class="btn ghost" id="csv">CSV</button><button class="btn ghost" id="share" hidden></button></div>
  <div class="msg ok" id="ok" hidden></div>
</section>

<p class="muted" id="t-legal"></p>
</div>

  var mnx=1e18,mxx=-1e18,mny=1e18,mxy=-1e18;P.forEach(function(p){mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);mxy=Math.max(mxy,p.y)});
  var w=Math.max(mxx-mnx,1),h=Math.max(mxy-mny,1),sc=Math.min((W-2*pad)/w,(H-2*pad)/h),ox=W/2-(mnx+w/2)*sc,oy=H/2+(mny+h/2)*sc;
  var X=function(p){return ox+p.x*sc},Y=function(p){return oy-p.y*sc};
  c.beginPath();P.forEach(function(p,k){k?c.lineTo(X(p),Y(p)):c.moveTo(X(p),Y(p))});c.closePath();
  c.fillStyle=res.cross?'rgba(255,90,77,.18)':'rgba(57,255,136,.16)';c.fill();c.strokeStyle=res.cross?'#ff5a4d':'#39ff88';c.lineWidth=3;c.lineJoin='round';c.stroke();
  c.font='600 15px ui-monospace,Menlo,monospace';c.textAlign='center';
  for(i=0;i<P.length;i++){var j=(i+1)%P.length,mx=(X(P[i])+X(P[j]))/2,my=(Y(P[i])+Y(P[j]))/2;if(P.length<=14){c.fillStyle='#f2f0ea';c.fillText(res.sides[i].toFixed(1),mx,my-8)}}
  for(i=0;i<P.length&&P.length<=60;i++){c.fillStyle='#f26a1b';c.beginPath();c.arc(X(P[i]),Y(P[i]),10,0,7);c.fill();c.fillStyle='#0b0b12';c.font='700 12px system-ui';c.fillText(String(i+1),X(P[i]),Y(P[i])+4)}
  var nice=[1,2,5,10,20,50,100,200,500,1000,2000,5000],sb=1;nice.forEach(function(n){if(n*sc<=W*.3)sb=n});
  c.strokeStyle='#f2f0ea';c.lineWidth=2;c.beginPath();c.moveTo(20,H-22);c.lineTo(20+sb*sc,H-22);c.moveTo(20,H-28);c.lineTo(20,H-16);c.moveTo(20+sb*sc,H-28);c.lineTo(20+sb*sc,H-16);c.stroke();
  c.fillStyle='#f2f0ea';c.textAlign='left';c.font='600 14px system-ui';c.fillText(sb+' m',20,H-32);
  c.textAlign='center';c.beginPath();c.moveTo(W-28,18);c.lineTo(W-20,40);c.lineTo(W-28,35);c.lineTo(W-36,40);c.closePath();c.fill();c.fillText('N',W-28,58);
}
/* Export */
function lines(){return pts.map(function(p){return p.lat.toFixed(7)+', '+p.lon.toFixed(7)}).join('\n')}
function dl(name,mime,data){var b=new Blob([data],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function gpx(){return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Homeveritas" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Homeveritas</name><trkseg>\n'+pts.concat(pts.length?[pts[0]]:[]).map(function(p){return '<trkpt lat="'+p.lat.toFixed(7)+'" lon="'+p.lon.toFixed(7)+'"/>'}).join('\n')+'\n</trkseg></trk></gpx>\n'}
function gj(){var c=pts.map(function(p){return[p.lon,p.lat]});c.push(c[0]);return JSON.stringify({type:'Feature',properties:{name:'Homeveritas',area_m2:Math.round(res.A*10)/10,perimeter_m:Math.round(res.L*10)/10},geometry:{type:'Polygon',coordinates:[c]}},null,2)}
function csv(){return 'n,lat,lon,accuracy_m\n'+pts.map(function(p,i){return(i+1)+','+p.lat.toFixed(7)+','+p.lon.toFixed(7)+','+(p.acc||0).toFixed(1)}).join('\n')+'\n'}
function say(id,txt){show('ok',txt)}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('add').addEventListener('click',setPoint);
$('undo').addEventListener('click',function(){pts.pop();save();render()});$('clear').addEventListener('click',function(){pts=[];save();render();show('ok','')});
$('auto').addEventListener('change',function(){$('stepw').hidden=!this.checked});
$('lang').addEventListener('change',function(){lang=this.value;try{localStorage.setItem('hv-live-lang',lang)}catch(e){}applyLang()});
$('copy').addEventListener('click',function(){var tx=lines();try{navigator.clipboard.writeText(tx).then(function(){say('ok',t('copied'))},function(){say('ok',t('copyFail'))})}catch(e){say('ok',t('copyFail'))}});
$('gpx').addEventListener('click',function(){dl('homeveritas-flaeche.gpx','application/gpx+xml',gpx())});
$('gj').addEventListener('click',function(){dl('homeveritas-flaeche.geojson','application/geo+json',gj())});
$('csv').addEventListener('click',function(){dl('homeveritas-flaeche.csv','text/csv',csv())});
if(navigator.share){$('share').hidden=false;$('share').addEventListener('click',function(){navigator.share({title:'Homeveritas',text:lines()}).catch(function(){})})}
window.HVLIVE={_analyse:analyse,_pts:function(){return pts},_finish:finish};
applyLang();
})();
</script>
